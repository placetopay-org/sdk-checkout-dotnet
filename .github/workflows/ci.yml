name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Checkout.sln

      - name: Format check
        # `dotnet format --verify-no-changes` exits non-zero if any tracked
        # source file would be reformatted by `dotnet format`. Catches style
        # drift the moment a PR opens, instead of in code review.
        run: dotnet format Checkout.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Checkout.sln --configuration Release --no-restore

      - name: Test
        # `coverlet.runsettings` enforces a 85 % line-coverage threshold; the
        # step fails the build if the gate is breached.
        run: >-
          dotnet test Checkout.sln
          --configuration Release
          --no-build
          --logger "trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*
